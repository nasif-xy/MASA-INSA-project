name: AI Auto Commit and PR

on:
  workflow_dispatch:
    inputs:
      task_description:
        description: 'Describe the changes/patch you want made'
        required: true
        default: 'Refactor and update documentation'

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK: ${{ github.event.inputs.task_description }}
        run: python ai_worker.py

      - name: Create Pull Request with Changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Automated AI patch"
          branch: "ai-patch-update"
          title: "AI Patch: ${{ github.event.inputs.task_description }}"
          body: "Automated patch created by AI workflow."
